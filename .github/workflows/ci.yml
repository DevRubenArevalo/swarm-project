name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, tests, and research claims
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      # The point of this step: every figure quoted in the paper is recomputed
      # from the committed raw data. It needs no GPU, no inference server and
      # no network, so CI can genuinely re-verify the research claims on every
      # commit rather than only checking that the code imports.
      - name: Verify every claim in the report against the raw data
        run: python -m swarm.verify

      - name: Scoring self-test
        run: python -m swarm.scoring
